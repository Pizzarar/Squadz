name: CI

on:
  push:
    branches: [dev, "unit/**"]
  pull_request:
    branches: [dev]

jobs:
  validate-and-test:
    name: Static validation & package unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run static stack validation
        run: node scripts/validate.mjs

      - name: Run scripts unit tests (if present)
        run: |
          if [ -f scripts/package.json ]; then
            cd scripts && npm ci && npm test
          fi

      - name: Run soundboard bot tests (if present)
        run: |
          if [ -f bots/soundboard/package.json ]; then
            cd bots/soundboard && npm ci && npm test
          fi

      - name: Run go-live streaming web tests (if present)
        run: |
          if [ -f web/golive/package.json ]; then
            cd web/golive && npm ci && npm test
          fi

  compose-smoke:
    name: Docker Compose build & runtime smoke test
    runs-on: ubuntu-latest
    needs: validate-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create throwaway .env on loopback (127.0.0.1 as MESH_IP)
        run: |
          cp .env.example .env
          sed -i 's|^MESH_IP=.*|MESH_IP=127.0.0.1|' .env
          sed -i 's|^LIVEKIT_API_KEY=.*|LIVEKIT_API_KEY=devkey|' .env
          sed -i 's|^LIVEKIT_API_SECRET=.*|LIVEKIT_API_SECRET=secret_that_is_at_least_32_characters_long_for_livekit|' .env
          sed -i 's|^TUWUNEL_REGISTRATION_TOKEN=.*|TUWUNEL_REGISTRATION_TOKEN=ci_test_reg_token|' .env
          mkdir -p web/golive bots/soundboard/clips

      - name: Validate docker compose config
        run: docker compose config -q

      - name: Build custom Caddy image (with caddy-dns/cloudflare)
        run: docker compose build caddy

      - name: Validate Caddyfile with custom Caddy binary
        run: |
          docker compose run --rm --entrypoint caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Boot core services (tuwunel, livekit, lk-jwt-service)
        run: docker compose up -d tuwunel livekit lk-jwt-service

      - name: Health check core services
        run: |
          set -euo pipefail
          echo "Waiting for tuwunel, livekit, and lk-jwt-service to become ready..."

          # Get the compose network name
          NET=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' $(docker compose ps -q tuwunel) | head -n1)
          echo "Using compose network: ${NET}"

          check_endpoint() {
            local name="$1"
            local url="$2"
            for i in $(seq 1 30); do
              if docker run --rm --network "${NET}" curlimages/curl:8.11.0 -fsS "${url}" >/dev/null 2>&1; then
                echo "[OK] ${name} responded at ${url}"
                return 0
              fi
              sleep 2
            done
            echo "[FAIL] ${name} did not respond at ${url} after 60s"
            docker compose logs
            return 1
          }

          check_endpoint "Tuwunel (/versions)" "http://tuwunel:6167/_matrix/client/versions"
          check_endpoint "Tuwunel (/.well-known/matrix/client)" "http://tuwunel:6167/.well-known/matrix/client"
          check_endpoint "LiveKit SFU (:7880)" "http://livekit:7880/"
          check_endpoint "lk-jwt-service (/healthz)" "http://lk-jwt-service:8080/healthz"

      - name: Tear down stack
        if: always()
        run: docker compose down -v
