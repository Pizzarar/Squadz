# Squadz · LiveKit SFU Configuration
# Docs: https://docs.livekit.io/home/self-hosting/deployment/
# Note: LiveKit's YAML loader (gopkg.in/yaml.v3) does not interpolate environment
# variables, so `rtc.node_ip` is intentionally not set here. The mesh IP is passed
# at runtime via the `--node-ip` CLI flag (set to the MESH_IP value) in
# docker-compose.yml, where Docker Compose expands it at container startup.
# API keys are likewise injected via the LIVEKIT_KEYS environment variable.

port: 7880
log_level: info

rtc:
  use_external_ip: false
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100

room:
  # Auto-create rooms when authorized via lk-jwt-service
  auto_create: true
  empty_timeout: 300
  max_participants: 20

turn:
  # Disabled: all peers communicate directly over the L3 mesh (Meshnet / Tailscale)
  enabled: false
